# Postgres local para control-gastos.
# Puerto 5434 en la maquina: el 5432 suele ser de un Postgres instalado y el
# 5433 lo usa otro proyecto (SIO). Solo escucha en tu Mac (127.0.0.1): nadie
# mas de tu red wifi puede conectarse a la base.
services:
  db:
    image: postgres:16-alpine
    container_name: control-gastos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos_local
      POSTGRES_DB: control_gastos
      # Fuerza es_CL para ordenamiento y mensajes coherentes.
      LANG: es_CL.utf8
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gastos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d control_gastos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gastos_data:
